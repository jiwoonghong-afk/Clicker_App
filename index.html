<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스위치 클리커</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">기계식 키보드 클리커</p>
      <h1>키보드 압력을<br>클릭으로 쌓아보자</h1>
      <p class="description">
        키캡을 눌러 점수와 경험치를 모으고, 콤보와 업그레이드로 타건감을 키우는
        스위치 감성 클리커 게임입니다.
      </p>
      <div class="hero-badges">
        <span>콤보 러시</span>
        <span>레벨업 성장</span>
        <span>테마 이펙트</span>
      </div>
    </section>

    <section class="playground">
      <div class="switch-panel">
        <div class="top-row">
          <div class="switch-header">
            <span class="status-dot"></span>
            <span id="switchLabel">청축 모드</span>
          </div>
          <div class="heat-pill">
            <span>콤보 x</span>
            <strong id="comboValue">1.0</strong>
          </div>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="스위치 종류">
          <button class="mode-tab is-active" data-mode="blue" aria-pressed="true">청축</button>
          <button class="mode-tab" data-mode="brown" aria-pressed="false">갈축</button>
          <button class="mode-tab" data-mode="red" aria-pressed="false">적축</button>
          <button class="mode-tab" data-mode="black" aria-pressed="false">흑축</button>
          <button class="mode-tab" data-mode="silent" aria-pressed="false">저소음축</button>
          <button class="mode-tab" data-mode="magnetic" aria-pressed="false">자석축</button>
        </div>

        <div class="panel-body">
          <div class="action-column">
            <div class="keyboard-deck blue" id="keyboardDeck" aria-label="V B N M 키보드 플레이 영역">
              <span class="mode-aura" id="modeAura" aria-hidden="true"></span>
              <span class="burst-layer" id="burstLayer" aria-hidden="true"></span>
              <span class="floating-score" id="floatingScore" aria-hidden="true"></span>

              <button class="key-stage key-button blue" data-key="v" aria-label="V 키">
                <span class="switch-frame">
                  <span class="switch-base"></span>
                  <span class="switch-stem"></span>
                  <span class="keycap" data-keycap>
                    <span class="keycap-ears" aria-hidden="true">
                      <span class="ear ear-left"></span>
                      <span class="ear ear-right"></span>
                    </span>
                    <span class="keycap-face" aria-hidden="true">
                      <span class="eye eye-left"></span>
                      <span class="eye eye-right"></span>
                      <span class="nose"></span>
                      <span class="whiskers whiskers-left"></span>
                      <span class="whiskers whiskers-right"></span>
                    </span>
                    <span class="keycap-top">V</span>
                    <span class="keycap-sub">ABS</span>
                  </span>
                </span>
              </button>

              <button class="key-stage key-button blue" data-key="b" aria-label="B 키">
                <span class="switch-frame">
                  <span class="switch-base"></span>
                  <span class="switch-stem"></span>
                  <span class="keycap" data-keycap>
                    <span class="keycap-ears" aria-hidden="true">
                      <span class="ear ear-left"></span>
                      <span class="ear ear-right"></span>
                    </span>
                    <span class="keycap-face" aria-hidden="true">
                      <span class="eye eye-left"></span>
                      <span class="eye eye-right"></span>
                      <span class="nose"></span>
                      <span class="whiskers whiskers-left"></span>
                      <span class="whiskers whiskers-right"></span>
                    </span>
                    <span class="keycap-top">B</span>
                    <span class="keycap-sub">ABS</span>
                  </span>
                </span>
              </button>

              <button class="key-stage key-button blue" data-key="n" aria-label="N 키">
                <span class="switch-frame">
                  <span class="switch-base"></span>
                  <span class="switch-stem"></span>
                  <span class="keycap" data-keycap>
                    <span class="keycap-ears" aria-hidden="true">
                      <span class="ear ear-left"></span>
                      <span class="ear ear-right"></span>
                    </span>
                    <span class="keycap-face" aria-hidden="true">
                      <span class="eye eye-left"></span>
                      <span class="eye eye-right"></span>
                      <span class="nose"></span>
                      <span class="whiskers whiskers-left"></span>
                      <span class="whiskers whiskers-right"></span>
                    </span>
                    <span class="keycap-top">N</span>
                    <span class="keycap-sub">ABS</span>
                  </span>
                </span>
              </button>

              <button class="key-stage key-button blue" data-key="m" aria-label="M 키">
                <span class="switch-frame">
                  <span class="switch-base"></span>
                  <span class="switch-stem"></span>
                  <span class="keycap" data-keycap>
                    <span class="keycap-ears" aria-hidden="true">
                      <span class="ear ear-left"></span>
                      <span class="ear ear-right"></span>
                    </span>
                    <span class="keycap-face" aria-hidden="true">
                      <span class="eye eye-left"></span>
                      <span class="eye eye-right"></span>
                      <span class="nose"></span>
                      <span class="whiskers whiskers-left"></span>
                      <span class="whiskers whiskers-right"></span>
                    </span>
                    <span class="keycap-top">M</span>
                    <span class="keycap-sub">ABS</span>
                  </span>
                </span>
              </button>
            </div>

            <div class="stats">
              <div class="stat-card">
                <span class="stat-label">총 클릭</span>
                <strong id="countValue">0</strong>
              </div>
              <div class="stat-card">
                <span class="stat-label">점수</span>
                <strong id="scoreValue">0</strong>
              </div>
              <div class="stat-card">
                <span class="stat-label">클릭 파워</span>
                <strong id="powerValue">1</strong>
              </div>
              <div class="stat-card">
                <span class="stat-label">자동 CPS</span>
                <strong id="autoValue">0</strong>
              </div>
            </div>
          </div>

          <div class="info-column">
            <div class="meter-card">
              <div class="meter-copy">
                <span class="stat-label">타건감 게이지</span>
                <strong id="feelValue">가볍고 경쾌함</strong>
              </div>
              <div class="meter-bar">
                <span id="meterFill"></span>
              </div>
            </div>

            <div class="level-card" id="levelCard">
              <div class="level-top">
                <span class="level-badge">LV <strong id="levelValue">1</strong></span>
                <div class="level-copy">
                  <strong id="levelTitle">입문 타건러</strong>
                  <span id="xpValue">0 / 58 XP</span>
                </div>
              </div>
              <div class="level-bar">
                <span id="levelFill"></span>
              </div>
            </div>

            <div class="shop-card">
              <div class="shop-heading">
                <div>
                  <p class="eyebrow shop-eyebrow">업그레이드</p>
                  <h2>튜닝 작업대</h2>
                </div>
                <strong id="rankValue">입문 보드</strong>
              </div>

              <div class="upgrade-list">
                <button class="upgrade-button" data-upgrade="spring">
                  <span class="upgrade-name">롱 스프링 모드</span>
                  <span class="upgrade-desc">클릭 점수 +1</span>
                  <strong id="cost-spring">25</strong>
                </button>
                <button class="upgrade-button" data-upgrade="keycap">
                  <span class="upgrade-name">아티즌 키캡</span>
                  <span class="upgrade-desc">콤보 유지 시간 증가</span>
                  <strong id="cost-keycap">60</strong>
                </button>
                <button class="upgrade-button" data-upgrade="lube">
                  <span class="upgrade-name">윤활 스테이션</span>
                  <span class="upgrade-desc">자동 클릭 +0.6/초</span>
                  <strong id="cost-lube">90</strong>
                </button>
                <button class="upgrade-button" data-upgrade="forge">
                  <span class="upgrade-name">스위치 공방</span>
                  <span class="upgrade-desc">전체 점수 배율 증가</span>
                  <strong id="cost-forge">140</strong>
                </button>
              </div>
            </div>
          </div>
        </div>

        <p class="hint">
          마우스 클릭, <kbd>V</kbd>, <kbd>B</kbd>, <kbd>N</kbd>, <kbd>M</kbd>으로 키를 누르고
          <kbd>1</kbd>~<kbd>6</kbd>으로 스위치를 바꿉니다.
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
